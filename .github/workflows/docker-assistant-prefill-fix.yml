name: Docker - Assistant Prefill Fix

on:
  push:
    branches: [upgrade/aistudio-v1.4.0-prefill-fix]
    paths:
      - "patches/assistant-prefill-compat.patch"
      - ".github/workflows/docker-assistant-prefill-fix.yml"
      - "Dockerfile"
      - "src/core/FormatConverter/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_USERNAME_SECRET: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_USERNAME_VAR: ${{ vars.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  DOCKERHUB_IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
  DOCKERHUB_REPOSITORY_VAR: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patch-source

      - name: Checkout latest upstream source
        uses: actions/checkout@v4
        with:
          repository: iBUHub/AIStudioToAPI
          ref: 0c5b6d379c4ef066b3bad01a5b4fee41626cb545
          path: app

      - name: Copy compatibility patch into upstream source
        run: cp patch-source/patches/assistant-prefill-compat.patch app/assistant-prefill-compat.patch

      - name: Apply Assistant Prefill compatibility patch
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git apply --check assistant-prefill-compat.patch
          git apply assistant-prefill-compat.patch
          node --check src/core/FormatConverter/ChatCompletionsConverter.js
          node --check src/core/FormatConverter/ClaudeRequestConverter.js
          grep -Fq 'Rewriting terminal OpenAI assistant prefill' src/core/FormatConverter/ChatCompletionsConverter.js
          grep -Fq 'Rewriting terminal Anthropic assistant prefill' src/core/FormatConverter/ClaudeRequestConverter.js

      - name: Install dependencies for smoke test
        working-directory: app
        run: npm install --no-save --ignore-scripts --no-audit --no-fund axios@^1.13.2 mime-types@^3.0.2

      - name: Smoke test request conversion
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('assert');
          const FormatConverter = require('./src/core/FormatConverter');
          const logger = new Proxy({}, { get: () => () => {} });
          const converter = new FormatConverter(logger, { config: {} });

          (async () => {
            const openaiPrefill = await converter.translateOpenAIToGoogle({
              model: 'gemini-3.7-flash',
              messages: [
                { role: 'user', content: 'Continue.' },
                { role: 'assistant', content: '<thinking>\n' },
              ],
            });
            assert.strictEqual(openaiPrefill.googleRequest.contents.at(-1).role, 'user');

            const openaiHistory = await converter.translateOpenAIToGoogle({
              model: 'gemini-3.7-flash',
              messages: [
                { role: 'user', content: 'First.' },
                { role: 'assistant', content: 'Earlier answer.' },
                { role: 'user', content: 'Latest.' },
              ],
            });
            assert.strictEqual(openaiHistory.googleRequest.contents[1].role, 'model');
            assert.strictEqual(openaiHistory.googleRequest.contents.at(-1).role, 'user');

            const openaiToolCall = await converter.translateOpenAIToGoogle({
              model: 'gemini-3.7-flash',
              messages: [
                { role: 'user', content: 'Use a tool.' },
                {
                  role: 'assistant',
                  content: 'Calling tool',
                  tool_calls: [{
                    id: 'call_1',
                    type: 'function',
                    function: { name: 'demo', arguments: '{}' },
                  }],
                },
              ],
            });
            assert.strictEqual(openaiToolCall.googleRequest.contents.at(-1).role, 'model');

            const claudePrefill = await converter.translateClaudeToGoogle({
              model: 'gemini-3.7-flash',
              max_tokens: 128,
              messages: [
                { role: 'user', content: 'Continue.' },
                { role: 'assistant', content: '<thinking>\n' },
              ],
            });
            assert.strictEqual(claudePrefill.googleRequest.contents.at(-1).role, 'user');

            const claudeArrayAssistant = await converter.translateClaudeToGoogle({
              model: 'gemini-3.7-flash',
              max_tokens: 128,
              messages: [
                { role: 'user', content: 'Continue.' },
                { role: 'assistant', content: [{ type: 'text', text: 'Array content' }] },
              ],
            });
            assert.strictEqual(claudeArrayAssistant.googleRequest.contents.at(-1).role, 'model');

            console.log('Assistant Prefill compatibility smoke tests passed.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Resolve Docker Hub credentials and image name
        id: docker
        shell: bash
        run: |
          set -euo pipefail
          username="${DOCKERHUB_USERNAME_SECRET:-${DOCKERHUB_USERNAME_VAR:-${DOCKER_USERNAME_SECRET:-${DOCKER_USERNAME_VAR:-}}}}"
          token="${DOCKERHUB_TOKEN:-${DOCKERHUB_ACCESS_TOKEN:-${DOCKERHUB_PASSWORD:-${DOCKER_PASSWORD:-${DOCKER_TOKEN:-}}}}}"
          if [ -z "$username" ]; then
            echo "::error::Docker Hub username is not configured."
            exit 1
          fi
          if [ -z "$token" ]; then
            echo "::error::Docker Hub credential is not configured."
            exit 1
          fi
          image="${DOCKERHUB_IMAGE_VAR:-${DOCKERHUB_REPOSITORY_VAR:-$username/aistudio-to-api}}"
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"
          echo "::add-mask::$token"
          printf '%s' "$token" | docker login --username "$username" --password-stdin
          echo "image=$image" >> "$GITHUB_OUTPUT"


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push patched image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.docker.outputs.image }}:v1.4.0-assistant-prefill-fix-test
            ${{ steps.docker.outputs.image }}:assistant-prefill-fix-v1.4.0-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Patched AIStudioToAPI multi-arch image"
            echo
            echo '```text'
            echo "${{ steps.docker.outputs.image }}:v1.4.0-assistant-prefill-fix-test"
            echo '```'
            echo
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Upstream source: iBUHub/AIStudioToAPI@0c5b6d379c4ef066b3bad01a5b4fee41626cb545"
            echo "Fix: terminal plain-text Assistant Prefill compatibility for OpenAI and Anthropic request conversion."
          } >> "$GITHUB_STEP_SUMMARY"
